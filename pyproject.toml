[project]
name = "llm-classification-finetuning"
version = "0.1.0"
description = "Reproducible Chatbot Arena human preference experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "scipy", "scikit-learn", "lightgbm",
  "torch", "sentence-transformers", "requests", "kaggle", "six",
  "matplotlib", "seaborn", "nbformat", "nbclient", "ipykernel", "pyarrow",
]

[project.optional-dependencies]
train = ["peft", "accelerate", "bitsandbytes", "safetensors"]
eda = [
    "lingua-language-detector>=2.1.1",
]
qa = [
    "playwright>=1.64.1",
    "ruff==0.17.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
